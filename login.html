<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in · CodeML</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;700&family=Source+Serif+4:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-page">
  <header class="header">
    <div class="header-side">
      <a class="logo" href="index.html">CodeML</a>
      <a class="navlink" href="curriculum.html">Curriculum</a>
    </div>
    <div class="header-side">
      <a class="navlink" href="login.html">Log in</a>
      <a class="btn btn-primary btn-m" href="login.html">Start learning</a>
    </div>
  </header>

  <main class="auth-body">
    <!-- 회원가입 직후(login.html?signup=done)에만 보인다 -->
    <div class="banner" id="signup-banner" hidden>
      <img src="assets/dot-success.svg" alt="" />
      <span>Account created. Log in to continue.</span>
    </div>
    <section class="auth-card">
      <p class="caption">WELCOME BACK</p>
      <h1 class="heading-serif">Log in to CodeML</h1>
      <p class="body-m secondary">Practice AI and Python problems, track your XP, and pick up where you left off.</p>
      <button class="google-btn" data-google="login">
        <img src="assets/icon-google.svg" alt="" />
        <span>Continue with Google</span>
      </button>
      <hr class="auth-divider" />
      <p class="auth-switch">New to CodeML? <a href="signup.html">Create an account</a></p>
    </section>
  </main>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
