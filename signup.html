<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up · CodeML</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;700&family=Source+Serif+4:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body class="auth-page">
  <header class="header">
    <div class="header-side">
      <a class="logo" href="index.html">CodeML</a>
      <a class="navlink" href="curriculum.html">Curriculum</a>
    </div>
    <div class="header-side">
      <a class="navlink" href="login.html">Log in</a>
      <a class="btn btn-primary btn-m" href="login.html">Start learning</a>
    </div>
  </header>

  <main class="auth-body">
    <section class="auth-card">
      <p class="caption">CREATE YOUR ACCOUNT</p>
      <h1 class="heading-serif">Join CodeML</h1>
      <p class="body-m secondary">Start solving AI-focused coding problems. One Google account is all you need.</p>
      <button class="google-btn" data-not-connected>
        <img src="assets/icon-google.svg" alt="" />
        <span>Sign up with Google</span>
      </button>
      <hr class="auth-divider" />
      <p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>

  <script src="js/common.js"></script>
</body>
</html>
